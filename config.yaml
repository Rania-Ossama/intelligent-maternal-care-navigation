# =====================================================================
#  Hospital Finder - configuration
#  Edit this file (not the code). Restart the app after changing it.
#  Relative paths are relative to the folder that contains this file.
#  On Windows you can use forward slashes or single-quoted paths:
#      nodes: 'C:\Users\dalia\Desktop\Enhanced Dijkstra\Upper_Egypt_nodes.parquet'
# =====================================================================

paths:
  # --- INPUT files. You can replace/update these any time; the app notices
  #     and rebuilds / reloads by itself (see README, "Updating the data").
  nodes: data/Upper_Egypt_nodes.parquet
  edges: data/Upper_Egypt_edges_weighted.parquet
  facilities: data/facilities_flagged.csv

  # --- OUTPUT folder: the app creates the processed graph here
  #     (graph_nodes.parquet, graph_edges.parquet, graph_meta.json,
  #      stitched_edges.csv). Safe to delete; it is rebuilt automatically.
  processed_dir: data/processed

# Column names inside your files. Defaults match the notebooks you shared.
columns:
  nodes:
    id: id
    lon: lon
    lat: lat
  edges:
    u: u                    # start node id
    v: v                    # end node id
    length: length          # metres
    time: travel_time_s     # seconds. If this column is missing the app
                            # computes it from length + maxspeed/highway.
    highway: highway
    maxspeed: maxspeed
  facilities:
    id: canonical_entity_id
    name: canonical_name
    governorate: governorate_assigned
    district: district
    address: address
    phone: phone
    phone_fallback: phone_clean
    lat: latitude_final
    lon: longitude_final
    tier: birth_service_tier
    category: facility_category
    coord_reliable: coord_reliable     # optional (exists in facilities_flagged.csv)

# ---------------------------------------------------------------------
#  Road graph build settings (changing these triggers an automatic rebuild)
# ---------------------------------------------------------------------
graph:
  # Keep only the largest strongly connected component, i.e. the part of the
  # network where every node can reach every other node following one-way
  # rules. Searches then can never get trapped in a cut-off island.
  keep_largest_scc: true

  stitching:
    enabled: true             # join small disconnected pieces to the main network
    max_gap_m: 500            # only gaps up to this distance are bridged
    min_component_nodes: 25   # ignore tiny fragments (dead-end stubs etc.)
    max_rounds: 4             # repeat, so chains of islands can be joined
    speed_kmh: 30             # speed assumed on the artificial bridge edges
    # --- big pieces, e.g. the other bank of the Nile when its bridges are missing from the data.
    #     Without this the whole bank is dropped and its hospitals become unreachable.
    large_component_nodes: 1000     # a piece this big gets the settings below
    large_max_gap_m: 3000           # ...may be bridged across a gap this wide (river width)
    large_bridge_spacing_m: 5000    # ...with one bridge per this many metres of river bank
    large_bridge_penalty_s: 120     # extra seconds added to each such crossing

  # Used ONLY when the edges file has no travel-time column.
  default_speed_kmh: 30
  highway_speed_kmh:
    motorway: 100
    motorway_link: 60
    trunk: 80
    trunk_link: 50
    primary: 60
    primary_link: 40
    secondary: 50
    secondary_link: 35
    tertiary: 40
    tertiary_link: 30
    unclassified: 30
    residential: 30
    living_street: 10
    service: 15
    track: 15
    road: 30

# ---------------------------------------------------------------------
#  Which facilities may be recommended (re-read when the CSV changes)
# ---------------------------------------------------------------------
facilities:
  # Always eligible
  include_tiers:
    - T1_maternity_hospital
    - T2_general_hospital_unverified

  # Eligible only if the name matches the regex (case-insensitive).
  # T3 contains real hospitals but also charities, syndicates, post offices...
  include_tiers_if_name_matches:
    T3_unspecified_hospital_unverified: "مستشف|hospital"
  # Tiers NOT listed above (e.g. T4_needs_review) are excluded.

  # Removed when the name matches (e.g. "under construction", post office)
  exclude_name_regex: "قيد الإنشاء|قيد الانشاء|تحت الإنشاء|تحت الانشاء|under construction|post office|مكتب بريد|بيطري|veterinary|مسجد|mosque"
  exclude_categories:
    - "veterinary (not human health)"
    - restricted_access_hospital

  drop_unreliable_coordinates: true     # uses the coord_reliable column if present
  max_snap_to_road_m: 1000              # facility further than this from a road is dropped

  tier_labels:
    T1_maternity_hospital: Maternity hospital
    T2_general_hospital_unverified: General hospital
    T3_unspecified_hospital_unverified: Hospital (type unverified)
    T4_needs_review: Needs review

# ---------------------------------------------------------------------
#  Search / UI behaviour
# ---------------------------------------------------------------------
search:
  results: 5                    # how many hospitals to return at first
  more_results: 5               # how many EXTRA hospitals the "Show more" button adds (it can be pressed once)
  eta_warn_minutes: 60          # ETA above this is flagged in red
  max_snap_to_road_m: 5000      # a pin further than this from any road is refused
  warn_snap_to_road_m: 1000     # a pin further than this gets a warning
  detour_warn_ratio: 3.0        # warn when road distance >= this x the straight-line distance
  detour_min_straight_km: 1.0   # ...but only for hospitals at least this far away in a straight line
  max_route_points: 4000        # route lines are thinned above this many points

server:
  host: 127.0.0.1
  port: 8000
  open_browser: true
  source_check_seconds: 5       # how often input files are checked for changes
  admin_localhost_only: true    # /api/admin/rebuild only from this computer

map:
  tile_url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
  tile_attribution: "&copy; OpenStreetMap contributors"
  center: [27.0, 31.0]
  zoom: 7
